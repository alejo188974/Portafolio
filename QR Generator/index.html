<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Generador de QR</title>

<link rel="stylesheet" href="estilos.css">

</head>
<body>
    <a href="../index.html" class="boton">Volver</a>
<h1>Generador de QR para Mesas</h1>

<div class="panel">

<input id="web" placeholder="https://tusitio.com/menu.html">

<input id="mesas" type="number" placeholder="Cantidad de mesas">

<button onclick="generar()">Generar</button>

<button onclick="window.print()">Imprimir QR</button>
<input type="file" id="logo" accept="image/png,image/jpeg">

Estilo: <select id="estilo">
<option value="square">Cuadrado</option>
<option value="rounded">Redondeado</option>
<option value="dots">Puntos</option>
<option value="classy">Elegante</option>
<option value="classy-rounded">Elegante redondeado</option>
</select>
Ojos: <select id="ojos">
<option value="square">Cuadrado</option>
<option value="extra-rounded">Redondeado</option>
<option value="dot">Punto</option>
</select>
Puntos: <select id="puntos">
<option value="square">Cuadrado</option>
<option value="dot">Punto</option>
</select>
Color 1<input type="color" id="color1" value="#000000">
Color 2<input type="color" id="color2" value="#ff0000">
</div>


<div id="qrs"></div>

<script src="js/qr-code-styling.js"></script>

<script>


// gradiente

function generarQR(){

const texto = document.getElementById("web").value || "https://tusitio.com/menu.html";
const color1 = document.getElementById("color1").value;
const color2 = document.getElementById("color2").value;

const qr = new QRious({
element: canvas,
value: texto,
size: 300,
background: "#ffffff",
foreground: color1
});

const ctx = canvas.getContext("2d");

const gradient = ctx.createLinearGradient(0,0,300,300);
gradient.addColorStop(0,color1);
gradient.addColorStop(1,color2);

ctx.fillStyle = gradient;

const imageData = ctx.getImageData(0,0,300,300);

for(let i=0;i<imageData.data.length;i+=4){

if(
imageData.data[i]===0 &&
imageData.data[i+1]===0 &&
imageData.data[i+2]===0
){
ctx.fillRect(
(i/4)%300,
Math.floor((i/4)/300),
1,
1
);
}

}
}


// Generacion de QRCodeStyling


function generar(){

let web = document.getElementById("web").value
let mesas = parseInt(document.getElementById("mesas").value)
let contenedor = document.getElementById("qrs")


contenedor.innerHTML=""

for(let i=1;i<=mesas;i++){

let caja = document.createElement("div")
caja.className="qrBox"

let titulo = document.createElement("h3")
titulo.innerText="Mesa "+i

let qrDiv = document.createElement("div")

caja.appendChild(titulo)
caja.appendChild(qrDiv)

contenedor.appendChild(caja)

let link = web + "?mesa=" + i

let estilo = document.getElementById("estilo").value

let archivoLogo = document.getElementById("logo").files[0]
let logoURL = ""

if(archivoLogo){
logoURL = URL.createObjectURL(archivoLogo)
}

let qr = new QRCodeStyling({

width:420,
height:420,

data:link,

image:logoURL,

dotsOptions:{
type:estilo,
gradient:{
type:"linear",
rotation:0,
colorStops:[
{offset:0,color:document.getElementById("color1").value},
{offset:1,color:document.getElementById("color2").value}
]
}
},

backgroundOptions:{
color:"#ffffff"
},
cornersSquareOptions:{
type:document.getElementById("ojos").value
},
cornersDotOptions:{
type:document.getElementById("puntos").value
},


imageOptions:{
margin:5,
imageSize:0.35
}

})


qr.append(qrDiv)
let texto = document.createElement("p")
texto.innerText = link
texto.style.fontSize = "12px"

caja.appendChild(texto)
}

}
document.getElementById("color1").addEventListener("input", generar)
document.getElementById("color2").addEventListener("input", generar)
document.getElementById("estilo").addEventListener("change", generar)
document.getElementById("logo").addEventListener("change", generar)
document.getElementById("web").addEventListener("input", generar)
document.getElementById("mesas").addEventListener("input", generar)
document.getElementById("ojos").addEventListener("change", generar)
document.getElementById("puntos").addEventListener("change", generar)

</script>

</body>
</html>
